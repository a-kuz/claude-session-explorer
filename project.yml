name: SessionExplorer
options:
  bundleIdPrefix: ai.enface
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO

targets:
  SessionExplorer:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - LaunchAgents
          - BackupAgent
          - Launcher
      - path: Sources/LaunchAgents/ai.enface.SessionExplorer.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: Sources/LaunchAgents/ai.enface.SessionExplorer.backup.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - target: SessionBackup
        embed: true
        copy:
          destination: executables
      - target: SessionLauncher
        embed: true
        copy:
          destination: executables
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Session Explorer
        CFBundleDisplayName: Session Explorer
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppleEventsUsageDescription: "Session Explorer opens the selected session in a new terminal tab."
    entitlements:
      path: Sources/SessionExplorer.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.enface.SessionExplorer
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"

  SessionBackup:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/Models
      - path: Sources/BackupAgent
    settings:
      base:
        PRODUCT_NAME: session-backup
        PRODUCT_BUNDLE_IDENTIFIER: ai.enface.SessionExplorer.backup
        SKIP_INSTALL: YES

  SessionLauncher:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Launcher
    settings:
      base:
        PRODUCT_NAME: session-launcher
        PRODUCT_BUNDLE_IDENTIFIER: ai.enface.SessionExplorer.launcher
        SKIP_INSTALL: YES

schemes:
  SessionExplorer:
    build:
      targets:
        SessionExplorer: all
    run:
      config: Debug
    archive:
      config: Release
